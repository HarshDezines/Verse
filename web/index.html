<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg">
    <div class="blob" id="blobA"></div>
    <div class="blob" id="blobB"></div>
    <div id="cover"><div class="cv"></div><div class="cv"></div></div>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
  </div>

  <div id="glow"><div class="g-haze"></div><div class="g-ring g-blur"></div><div class="g-ring"></div></div>
  <div id="fog">
    <div class="f-haze"></div>
    <div class="f-wrap f-w1"><div class="f-col f-c1"></div></div>
    <div class="f-wrap f-w2"><div class="f-col f-c2"></div></div>
    <div class="f-wrap f-w3"><div class="f-col f-c3"></div></div>
  </div>

  <div id="art3d">
    <div class="backdrop"></div>
    <canvas id="cloud"></canvas>
    <div class="cam">
      <div class="card">
        <div class="edge" style="transform:translateZ(-2px)"></div>
        <div class="edge" style="transform:translateZ(-4px)"></div>
        <div class="edge" style="transform:translateZ(-6px)"></div>
        <div class="edge" style="transform:translateZ(-8px)"></div>
        <div class="edge" style="transform:translateZ(-10px)"></div>
        <div class="edge" style="transform:translateZ(-12px)"></div>
        <div class="face"><div class="gloss"></div></div>
        <div class="refl"></div>
      </div>
    </div>
  </div>

  <div id="stage"></div>

  <div id="dots"><i></i><i></i><i></i></div>

  <div id="message">
    <div class="m-title"></div>
    <div class="m-sub"></div>
  </div>

  <div id="hud">
    <div id="hud-row">
      <div id="hud-meta"><span id="hud-title"></span><span id="hud-artist"></span></div>
      <div class="hud-btns">
      <button id="vis-btn" title="Visualiser style: card / point cloud (V)" aria-label="Change visualiser style"><i></i></button>
      <button id="cover-btn" title="Album art background (B)" aria-label="Toggle album art background"><i></i></button>
      <button id="glow-btn" title="Border: strip / fog / off (G)" aria-label="Cycle border effect"><i></i></button>
      </div>
    </div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>

  <div id="toast"></div>
  <pre id="debug"></pre>

  <script src="app.js"></script>
</body>
</html>
